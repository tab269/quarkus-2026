quarkus.http.port=8080

quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:file:./db/h2-data/orders-db
quarkus.datasource.username=sa
quarkus.datasource.password=sa

quarkus.hibernate-orm.schema-management.strategy=none

quarkus.hibernate-orm.log.sql=true

quarkus.liquibase.migrate-at-start=true

mp.messaging.outgoing.orders.connector=smallrye-amqp
mp.messaging.outgoing.orders.address=orders
mp.messaging.outgoing.orders.host=localhost
mp.messaging.outgoing.orders.port=5672
mp.messaging.outgoing.orders.amqp.idle-timeout=0
